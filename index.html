<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Map maker</title>
    <meta name="description" content="Generate and edit themed fantasy maps, then export them as SVG or PNG.">

    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Link previews (blog, Facebook, LinkedIn, X). Share URLs must be absolute. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Map maker">
    <meta property="og:title" content="Map maker">
    <meta property="og:description" content="Generate and edit themed fantasy maps, then export them as SVG or PNG.">
    <meta property="og:url" content="https://www.andyhawkes.co.uk/experiments/maps/index.html">
    <meta property="og:image" content="https://www.andyhawkes.co.uk/experiments/maps/og-image.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="A parchment fantasy map with regions named The Bloodlands, Bonetor Vale, The Redlands and The Southern Wilds">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Map maker">
    <meta name="twitter:description" content="Generate and edit themed fantasy maps, then export them as SVG or PNG.">
    <meta name="twitter:image" content="https://www.andyhawkes.co.uk/experiments/maps/og-image.jpg">

    <link rel="stylesheet" href="css/editor.css" />
    <link rel="stylesheet" href="css/map.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" />
</head>

<body>
    <!-- Shown instead of the editor on small screens (see editor.css) -->
    <div class="small-screen" role="alert">
        <span class="icon" aria-hidden="true">desktop_windows</span>
        <h1>Map maker</h1>
        <p>The map editor needs a bigger screen. Please open this page on a computer or tablet.</p>
    </div>

    <header class="topbar">
        <h1>Map maker</h1>
        <div class="topbar-actions">
            <button id="newMapButton" class="primary" popovertarget="newMapPanel">
                <span class="icon" aria-hidden="true">add</span>New
            </button>
            <button id="openButton"><span class="icon" aria-hidden="true">folder_open</span>Open</button>
            <button id="saveButton"><span class="icon" aria-hidden="true">save</span>Save</button>
            <button id="exportButton" popovertarget="exportMenu">
                <span class="icon" aria-hidden="true">download</span>Export
            </button>
            <button id="shareButton" popovertarget="sharePanel">
                <span class="icon" aria-hidden="true">link</span>Share
            </button>
            <input type="file" id="openFile" accept=".json,application/json" hidden>
        </div>
        <div class="topbar-info" id="mapInfo"></div>
        <button id="sidepanelToggle" class="topbar-toggle" aria-controls="sidepanel">
            <span class="icon" aria-hidden="true">right_panel_close</span>
        </button>
    </header>

    <div id="newMapPanel" class="popover" popover></div>
    <div id="exportMenu" class="popover menu" popover></div>
    <div id="sharePanel" class="popover share" popover></div>

    <main class="workspace">
        <nav class="toolstrip" id="toolstrip" aria-label="Tools"></nav>

        <section class="stage" id="stage">
            <div class="tool-options" id="toolOptions" role="toolbar" aria-label="Tool options"></div>
            <div class="map-frame" id="mapFrame"></div>
            <div class="statusbar" id="statusbar" role="status"></div>
        </section>

        <aside class="sidepanel" id="sidepanel">
            <div class="panel-tabs" role="tablist" id="panelTabs"></div>
            <div class="panel-body" id="panelBody"></div>
        </aside>
    </main>

    <script type="module" src="/src/main.js"></script>

    <!-- This builds on the awesome work done by Martin O'Leary - https://mewo2.com/notes/terrain/ -->
</body>

</html>
